app-id: io.github.leandrostanger.universidadelivre
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: universidade-livre

finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --device=dri

modules:
  - name: universidade-livre
    buildsystem: simple
    build-commands:
      - install -d /app/lib/universidade-livre
      - cp -a . /app/lib/universidade-livre/
    sources:
      - type: dir
        path: ../../release/linux-unpacked

  - name: universidade-livre-integration
    buildsystem: simple
    build-commands:
      - install -Dm755 universidade-livre /app/bin/universidade-livre
      - install -Dm644 io.github.leandrostanger.universidadelivre.desktop /app/share/applications/io.github.leandrostanger.universidadelivre.desktop
      - install -Dm644 io.github.leandrostanger.universidadelivre.png /app/share/icons/hicolor/128x128/apps/io.github.leandrostanger.universidadelivre.png
      - install -Dm644 io.github.leandrostanger.universidadelivre.metainfo.xml /app/share/metainfo/io.github.leandrostanger.universidadelivre.metainfo.xml
    sources:
      - type: dir
        path: .
