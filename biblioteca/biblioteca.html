<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="library_title">Biblioteca · Universidade Livre</title>
    <meta name="description" content="Biblioteca digital com livros gratuitos, links para acervos online e audiobooks.">
    <meta name="theme-color" content="#0D1117">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="biblioteca.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <a href="../index.html">
                <img src="../logo-da-universidade-livre.png" alt="Universidade Livre" class="logo-universidade" style="height: 60px; width: auto; object-fit: contain;">
            </a>
            <p data-i18n="library_subtitle">Biblioteca Digital</p>
        </div>
        <div class="stats">
            <div class="stat-item"><i class="fas fa-book"></i> <span id="bookCount">0</span> <span data-i18n="library_book_count">itens</span></div>
            <div class="stat-item language-switch">
                <button id="langPtBtn" class="lang-btn active" data-lang="pt-br">PT</button>
                <span class="lang-sep">|</span>
                <button id="langEnBtn" class="lang-btn" data-lang="en">EN</button>
            </div>
            <a href="https://leandrostanger.github.io/LeandroStanger/#doacoes" class="donate-button" target="_blank" rel="noopener noreferrer" data-i18n="donate_button">
                <i class="fas fa-heart"></i><span data-i18n="donate_text">Doar</span>
            </a>
            <a href="../auditorio/auditorio.html" class="btn-biblioteca" style="background: var(--accent-blue);"><i class="fas fa-video"></i> Auditório</a>
            <a href="../notas/notas.html" class="btn-biblioteca" target="_blank" style="background: var(--accent-green);"><i class="fas fa-pencil-alt"></i> Notas</a>
            <a href="../index.html" class="btn-biblioteca"><i class="fas fa-arrow-left"></i> <span data-i18n="back_to_courses">Voltar para cursos</span></a>
        </div>
    </div>

    <!-- Abas principais -->
    <div class="main-tabs">
        <button class="main-tab-btn active" data-main-tab="library"><i class="fas fa-book"></i> <span data-i18n="tab_library">Biblioteca</span></button>
        <button class="main-tab-btn" data-main-tab="audiobooks"><i class="fas fa-headphones"></i> <span data-i18n="tab_audiobooks">Audiobooks</span></button>
        <button class="main-tab-btn" data-main-tab="recommended"><i class="fas fa-globe"></i> <span data-i18n="tab_recommended">Bibliotecas Recomendadas</span></button>
    </div>

    <!-- Conteúdo da aba "Biblioteca" -->
    <div id="libraryTabContent" class="main-tab-content active">
        <div class="search-bar">
            <input type="text" id="searchInput" data-i18n="search_library_placeholder" placeholder="Buscar por título, autor, idioma ou assunto...">
        </div>

        <div class="tabs-header">
            <button class="tab-btn active" data-tab="book"><i class="fas fa-book"></i> <span data-i18n="filter_books">Livros</span></button>
            <button class="tab-btn" data-tab="article"><i class="fas fa-file-alt"></i> <span data-i18n="filter_articles">Artigos</span></button>
            <button class="tab-btn" data-tab="paper"><i class="fas fa-file-pdf"></i> <span data-i18n="filter_papers">Papers</span></button>
            <button class="tab-btn" data-tab="tcc"><i class="fas fa-graduation-cap"></i> <span data-i18n="filter_tcc">TCC</span></button>
            <button class="tab-btn" data-tab="dissertation"><i class="fas fa-tasks"></i> <span data-i18n="filter_dissertation">Dissertações</span></button>
            <button class="tab-btn" data-tab="thesis"><i class="fas fa-award"></i> <span data-i18n="filter_thesis">Teses</span></button>
        </div>

        <div id="booksGrid" class="book-grid"></div>
    </div>

    <!-- Conteúdo da aba "Audiobooks" -->
    <div id="audiobooksTabContent" class="main-tab-content">
        <div class="search-bar">
            <input type="text" id="audiobookSearchInput" data-i18n="search_audiobooks_placeholder" placeholder="Buscar audiobooks por título ou autor...">
        </div>
        <div class="filter-bar" id="audioLanguageFilterContainer" style="display: none;">
            <span data-i18n="filter_by_language">Filtrar por idioma:</span>
            <div class="chips-container" id="audioLanguageChips"></div>
        </div>
        <div id="continueListeningSection" class="continue-listening-section" style="display: none;">
            <h3 class="section-subtitle"><i class="fas fa-history"></i> <span data-i18n="continue_listening">Continuar ouvindo</span></h3>
            <div id="continueListeningContainer" class="continue-listening-container"></div>
        </div>
        <h3 class="section-subtitle"><i class="fas fa-search"></i> <span data-i18n="search_results">Resultados da busca</span></h3>
        <div id="audiobooksGrid" class="audiobooks-grid"></div>
    </div>

    <!-- Conteúdo da aba "Bibliotecas Recomendadas" -->
    <div id="recommendedTabContent" class="main-tab-content">
        <div id="externalLibrariesGrid" class="external-libraries-grid"></div>
    </div>
</div>

<!-- Modal de detalhes do item -->
<div id="bookModal" class="book-modal">
    <div class="modal-content">
        <button class="close-modal">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<!-- Container para player de áudio -->
<div id="multiAudioPlayerContainer" class="multi-audio-player-container" style="display: none;"></div>

<script src="audiobook.js"></script>
<script src="biblioteca.js"></script>
</body>
</html>
